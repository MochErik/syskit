[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "syskit-cli"
version = "1.0.0"
description = "The Ultimate Developer & Systems Engineering CLI Suite - 100% Local Standalone Utilities"
readme = "README.md"
authors = [
  { name = "Moch. Erik Irriansyah", email = "erik@narotama.ac.id" }
]
license = { text = "MIT" }
keywords = ["cli", "devtools", "sysadmin", "networking", "git", "security", "docker", "fastapi"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
  "Topic :: Software Development :: Build Tools",
]
requires-python = ">=3.8"
dependencies = []

[project.scripts]
syskit = "syskit.cli:main"

[project.urls]
Homepage = "https://github.com/MochErik/syskit"
Repository = "https://github.com/MochErik/syskit.git"
Issues = "https://github.com/MochErik/syskit/issues"
